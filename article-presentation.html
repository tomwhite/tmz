<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
    <script src="tmz.js"></script>
    <script type="text/javascript">
      function draw_z_curve(suffix, i) {
        const w = (i % 2 == 0) ? 2 ** (i / 2) : 2 ** ((i + 1) / 2);
        const h = (i % 2 == 0) ? 2 ** (i / 2) : 2 ** ((i - 1) / 2);
        const n = 2 * i;
        const z = 2 ** i - 1;

        const scale = 25;
        const svg = d3
          .select(`#container-${suffix}`)
          .append("svg")
          .attr("width", scale * w)
          .attr("height", scale * h);
        svg
          .append("g")
          .attr("transform", `translate(${scale / 2},${scale / 2})`)
          .append("path")
          .attr("id", "tmz-z-curve")
          .attr("d", z_curve_path(z, scale))
          .attr("fill", "none")
          .attr("stroke", "blue")
          .attr("stroke-width", 2)
          .attr("stroke-opacity", 0.5)
          .attr("stroke-linejoin", "round")
          .attr("pointer-events", "none");
      }
      function draw_tmz(suffix, i) {
        const light = "#A2F2F1";
        const dark = "steelblue";

        const w = (i % 2 == 0) ? 2 ** (i / 2) : 2 ** ((i + 1) / 2);
        const h = (i % 2 == 0) ? 2 ** (i / 2) : 2 ** ((i - 1) / 2);
        const n = 2 * i;
        const z = 2 ** i - 1;

        const data = thue_morse_coords_z_values(i);

        const scale = 25;
        const svg = d3
          .select(`#container-${suffix}`)
          .append("svg")
          .attr("width", scale * w)
          .attr("height", scale * h);
        svg
          .append("g")
          .attr("fill-opacity", 0.3)
          .selectAll()
          .data(data)
          .join("rect")
          .attr("fill", (d) => (d.value == 0 ? light : dark))
          .attr("x", (d) => scale * d.x)
          .attr("width", scale)
          .attr("y", (d) => scale * d.y)
          .attr("height", scale);
        svg
          .append("g")
          .attr("font-size", 24)
          .attr("text-anchor", "middle")
          .attr("dominant-baseline", "central")
          .selectAll()
          .data(data)
          .join("text")
          .attr("x", (d) => scale * (d.x + 0.5))
          .attr("y", (d) => scale * (d.y + 0.5))
          .text((d) => d.value)

        svg
          .append("g")
          .attr("transform", `translate(${scale / 2},${scale / 2})`)
          .append("path")
          .attr("id", "tmz-z-curve")
          .attr("d", z_curve_path(z, scale))
          .attr("fill", "none")
          .attr("stroke", "blue")
          .attr("stroke-width", 2)
          .attr("stroke-opacity", 0.5)
          .attr("stroke-linejoin", "round")
          .attr("pointer-events", "none");
      }
    </script>
  </head>

  <body>
    <h3>Z-order curve</h3>
    <div id="container-z-curve"></div>

    <h3>TM on a Z-order curve</h3>
    <p>T<sub>0</sub> = 0</p>
    <div id="container-T0"></div>

    <p>T<sub>1</sub> = 01</p>
    <div id="container-T1"></div>

    <p>T<sub>2</sub> = 0110</p>
    <div id="container-T2"></div>

    <p>T<sub>3</sub> = 01101001</p>
    <div id="container-T3"></div>

    <p>T<sub>4</sub> = 0110100110010110</p>
    <div id="container-T4"></div>

    <script type="text/javascript">
      draw_z_curve("z-curve", 4)
      draw_tmz("T0", 0);
      draw_tmz("T1", 1);
      draw_tmz("T2", 2);
      draw_tmz("T3", 3);
      draw_tmz("T4", 4);
    </script>
  </body>
</html>
