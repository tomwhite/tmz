<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
    <script src="tmz.js"></script>
    <script src="article.js"></script>
  </head>

  <body>
    <h3>The TMZ pattern</h3>
    <div id="container-tmz"></div>

    <h3>Z-order curve</h3>
    <div id="container-z-curve"></div>

    <h3>TM on a Z-order curve</h3>
    <p>T<sub>0</sub> = 0</p>
    <div id="container-T0"></div>

    <p>T<sub>1</sub> = 01</p>
    <div id="container-T1"></div>

    <p>T<sub>2</sub> = 0110</p>
    <div id="container-T2"></div>

    <p>T<sub>3</sub> = 01101001</p>
    <div id="container-T3"></div>

    <p>T<sub>4</sub> = 0110100110010110</p>
    <div id="container-T4"></div>

    <h3>Recursive Expansion</h3>
    <p>See <a href="article-recursive-figures.html">Recursive Expansion</a></p>

    <script type="text/javascript">
      draw_tmz("tmz", 8);
      draw_z_curve("z-curve", 4)
      draw_tmz("T0", 0, 0, true, true);
      draw_tmz("T1", 1, 1, true, true);
      draw_tmz("T2", 2, 2, true, true);
      draw_tmz("T3", 3, 3, true, true);
      draw_tmz("T4", 4, 4, true, true);
    </script>
  </body>
</html>
