<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
    <script src="tmz.js"></script>
    <script src="article.js"></script>
  </head>

  <body>
    <h3>TM appears in TMZ</h3>

    <p>For example, for the 4x4 pattern generated by $T_4$, the top row is $T_2$ (0110).</p>
    <div id="container-T4"></div>


    <p></p>
    <div id="container-T4-z-curve"></div>

    <p></p>
    <div id="container-T4-values"></div>

    <p></p>
    <div id="container-T4-top-row"></div>

    <p>Columns</p>
    <div id="container-T4-z-curve-columns"></div>

    <script type="text/javascript">
      draw_tmz("T4", 4, 4, true, false);

      draw_tmz("T4-z-curve", 4, 5, false, true);
      expand("T4-z-curve", 4);
      invert("T4-z-curve", 4);
      highlight_("T4-z-curve", 4);
      highlight_z_connection("T4-z-curve", 3, 3, 4, 0);

      draw_tmz("T4-values", 4, 5, true, false);
      expand("T4-values", 4);
      invert("T4-values", 4);
      highlight_("T4-values", 4);

      draw_tmz("T4-top-row", 4, 5, true, false, 0);
      expand("T4-top-row", 4);
      invert("T4-top-row", 4);
      highlight_("T4-top-row", 4);

      draw_tmz("T4-z-curve-columns", 5, 6, false, true);
      expand("T4-z-curve-columns", 5);
      invert("T4-z-curve-columns", 5);
      highlight_("T4-z-curve-columns", 5);
      highlight_z_connection("T4-z-curve-columns", 7, 3, 0, 4);

    </script>
  </body>
</html>
