<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
    <script src="tmz.js"></script>
  </head>

  <body>
    <div>
      <input type="range" id="k_input" name="k" min="0" max="7" value="4" />
      <label for="k"><i>k</i>=<output id="k_output">4</output></label>
    </div>
    <div id="container"></div>
    <script type="text/javascript">
      function tmz(k) {
        const n = 2 * k;
        const tm = thue_morse_seq(n);

        // square of size 2^k
        const data = thue_morse_coords_z(n);

        d3.select("svg").remove();

        const svg = d3
          .select("#container")
          .append("svg")
          .attr("width", 1600)
          .attr("height", 1600);

        const scale = 10;
        svg
          .append("g")
          .attr("fill", "steelblue")
          .attr("fill-opacity", 1)
          .selectAll()
          .data(data)
          .join("rect")
          .attr("x", (d) => scale * d.x)
          .attr("width", scale)
          .attr("y", (d) => scale * d.y)
          .attr("height", scale);
      }

      const input = document.querySelector("#k_input");
      const output = document.querySelector("#k_output");
      input.addEventListener("input", (event) => {
        const k = event.target.value;
        output.value = k;
        tmz(k);
      });

      const k = input.value;
      tmz(k);
    </script>
  </body>
</html>
