<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
    <script src="tmz.js"></script>
  </head>

  <body>
    <div id="container"></div>
    <script type="text/javascript">
      function tmz(k) {
        const n = 2 * k;
        const size = 2 ** k;

        // square of size 2^k
        const data = thue_morse_coords_z(n);

        d3.select("svg").remove();

        const scale = 10;
        const svg = d3
          .select("#container")
          .append("svg")
          .attr("viewBox", `-1 -1 ${scale * size} ${scale * size}`)
          .attr("width", scale * size)
          .attr("height", scale * size);
        svg
          .append("g")
          .attr("fill", "steelblue")
          .attr("fill-opacity", 1)
          .selectAll()
          .data(data)
          .join("rect")
          .attr("x", (d) => scale * d.x)
          .attr("width", scale)
          .attr("y", (d) => scale * d.y)
          .attr("height", scale);

        svg
          .append("g")
          .attr("transform", `translate(${scale / 2},${scale / 2})`)
          .append("path")
          .attr("id", "tmz-z-curve")
          .attr("d", "")
          .attr("fill", "none")
          .attr("stroke", "black")
          .attr("stroke-width", 1)
          .attr("stroke-opacity", 1)
          .attr("pointer-events", "none");

        const highlight = "red"; // TODO: move
        const strokeWidth = 2;
        svg
          .append("g")
          .append("rect")
          .attr("id", "tmz-highlight-1")
          .attr("width", scale)
          .attr("height", scale)
          .attr("x", 0)
          .attr("y", 0)
          .attr("fill", "none")
          .attr("stroke", highlight)
          .attr("stroke-width", 2)
          .attr("pointer-events", "none");
        svg
          .append("g")
          .append("rect")
          .attr("id", "tmz-highlight-2")
          .attr("width", scale)
          .attr("height", scale)
          .attr("x", 0)
          .attr("y", 0)
          .attr("fill", "none")
          .attr("stroke", highlight)
          .attr("stroke-width", 2)
          .attr("pointer-events", "none");
        svg
          .append("g")
          .append("rect")
          .attr("id", "tmz-highlight-3")
          .attr("width", scale)
          .attr("height", scale)
          .attr("x", 0)
          .attr("y", 0)
          .attr("fill", "none")
          .attr("stroke", highlight)
          .attr("stroke-width", 2)
          .attr("pointer-events", "none");

        let z = 0;
        let ticker = d3.interval(() => {
          z++;
          let x = deinterleave(z);
          let y = deinterleave(z >> 1);
          d3.selectAll("#tmz-highlight-1")
            .attr("x", scale * x)
            .attr("y", scale * y);
          d3.selectAll("#tmz-highlight-2").attr("x", scale * z);
          d3.selectAll("#tmz-highlight-3").attr("y", scale * z);
          d3.selectAll("#tmz-z-curve").attr("d", z_curve_path(z, scale));

          if (z >= 2 ** k - 1) {
            ticker.stop();
          }
        }, 750);
      }

      const k = 4;
      tmz(k);
    </script>
  </body>
</html>
