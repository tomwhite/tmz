<html>
  <head>
    <title>TMZ</title>
    <script src="d3.v7.min.js"></script>
  </head>

  <body>
    <h1>TMZ</h1>
    <p><i>Tom White, November 2025</i></p>
    <button onclick="update()">Update</button>
    <div id="container"></div>
    <script type="text/javascript">
      const scale = 10;
      const svg = d3
        .select("#container")
        .append("svg")
        .attr("width", 1600)
        .attr("height", 1600)
        .append("g")
        .attr("id", "root")
        .append("rect")
        .attr("x", 0)
        .attr("width", scale)
        .attr("y", 0)
        .attr("height", scale)
        .attr("fill", "steelblue");
      let k = 0;

      function invert(node) {
        invertRecursive(node);
        return node;
      }

      function invertRecursive(node) {
        // invert the colours of all rect elements recursively
        if (node.nodeName == "rect") {
          if (node.getAttribute("fill") == "steelblue") {
            node.setAttribute("fill", "white");
          } else if (node.getAttribute("fill") == "white") {
            node.setAttribute("fill", "steelblue");
          }
        }
        const children = node.children;
        for (let child of children) {
          invertRecursive(child);
        }
      }
      function update() {
        console.log("update", k);
        const size = 2 ** k;

        // 0 -> 01
        //      23
        // where 0 and 3 are copies of 0, and 1 and 2 are inverted copies of 0
        const square0 = d3.select("#root").selectChildren().remove().node();
        const square1 = invert(square0.cloneNode(true));
        const square2 = square1.cloneNode(true);
        const square3 = square0.cloneNode(true);

        const g = d3.select("#root").append("g");

        g.append("g").attr("id", `tmz-${k}-0`).node().appendChild(square0);
        g.append("g").attr("id", `tmz-${k}-1`).node().appendChild(square1);
        g.append("g").attr("id", `tmz-${k}-2`).node().appendChild(square2);
        g.append("g").attr("id", `tmz-${k}-3`).node().appendChild(square3);

        const t = d3.transition().duration(2000).ease(d3.easeLinear);
        const s = scale * size;

        d3.selectAll(`#tmz-${k}-1`)
          //   .transition(t)
          .style("transform", `translate(${s}px,0px)`);
        d3.selectAll(`#tmz-${k}-2`)
          //   .transition(t)
          .style("transform", `translate(0px,${s}px)`);
        d3.selectAll(`#tmz-${k}-3`)
          //   .transition(t)
          .style("transform", `translate(${s}px,${s}px)`);

          // highlight constituent squares for a short while
        for (let i = 0; i < 4; i++) {
          d3.selectAll(`#tmz-${k}-${i}`)
            .append("rect")
            .attr("width", s)
            .attr("height", s)
            .attr("fill", "none")
            .attr("stroke", "orange")
            .attr("stroke-width", 2)
            .transition(t)
            .style("stroke-opacity", 0);
        }

        k++;
      }
    </script>
  </body>
</html>
